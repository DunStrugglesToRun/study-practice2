<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Автозапчасти Trlm.ru</title>
    <link rel="shortcut icon" href="./images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="" />
    <link rel="icon" type="image/png" sizes="16x16" href="" />
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-logo-wrapper">
        <button class="header-menu-burger" type="button"></button>
        <a href="/" class="header-logo">
          <img class="header-logo-image" src="./icons/logo.png" alt="Логотип trlm.ru" width="80" height="88" />
        </a>
        <a href="/" class="header-logo-replacement">trim.ru</a>
      </div>
      <details class="office-dropdown">
        <summary>Малиновского</summary>
        <ul class="office-list">
          <li><a href="#">Офис 2</a></li>
          <li><a href="#">Офис 3</a></li>
        </ul>
      </details>
      <button class="catalogue-button button" type="button">Каталог</button>
      <a href="tel:88005501980" class="header-contact-number">8-800-550-19-80</a>
      <nav class="header-menu">
        <ul class="header-menu-list">
          <li class="header-menu-item selecting-spares-li">
            <a href="/" class="header-menu-link selecting-spares is-current">Подбор запчастей</a>
          </li>
          <li class="header-menu-item delivery-li">
            <a href="/" class="header-menu-link delivery">Доставка</a>
          </li>
          <li class="header-menu-item how-to-buy-li">
            <a href="/" class="header-menu-link how-to-buy">Как купить</a>
          </li>
          <li class="header-menu-item payment-li">
            <a href="/" class="header-menu-link payment">Оплата</a>
          </li>
          <li class="header-menu-item discounts-li">
            <a href="/" class="header-menu-link discounts">Акции</a>
          </li>
          <li class="header-menu-item contacts-li">
            <a href="/" class="header-menu-link contacts">Контакты</a>
          </li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="header-actions-item button-informal header-sign-in-button" type="button">Войти</button>
        <button class="header-actions-item button-informal header-cart-button" type="button">Корзина</button>
      </div>
      <search class="search-container">
        <form class="search-form" action="/" method="GET">
          <input class="search-input" type="search" name="q" placeholder="Что ищите?" aria-label="Строка поиска" />
          <button title="Искать" type="button" class="search-button button-informal"></button>
        </form>
      </search>
    </header>
  </body>
</html>
